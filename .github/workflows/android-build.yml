name: Android CI / Build APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleDebug --stacktrace
          else
            gradle bundleDebug --stacktrace
          fi

      - name: Locate & Stage APK
        run: |
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          # Locate generated APK
          FOUND_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi

          echo "Found APK at $FOUND_APK"
          cp "$FOUND_APK" .build-outputs/app-debug.apk
          cp "$FOUND_APK" APK_DOWNLOAD/app-debug.apk

          # Locate AAB if available
          FOUND_AAB=$(find app/build/outputs/bundle/debug/ -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$FOUND_AAB" ] && [ -f "$FOUND_AAB" ]; then
            echo "Found AAB at $FOUND_AAB"
            cp "$FOUND_AAB" .build-outputs/app-debug.aab
            cp "$FOUND_AAB" APK_DOWNLOAD/app-debug.aab
          fi

      - name: Validate Generated APK
        run: |
          echo "Validating APK existence and file size..."
          if [ ! -f "APK_DOWNLOAD/app-debug.apk" ]; then
            echo "ERROR: APK_DOWNLOAD/app-debug.apk does not exist!"
            exit 1
          fi

          SIZE=$(stat -c%s APK_DOWNLOAD/app-debug.apk)
          echo "APK Size: $SIZE bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: APK is smaller than 1 MB ($SIZE bytes)!"
            exit 1
          fi

          echo "APK Hash (SHA-256):"
          sha256sum APK_DOWNLOAD/app-debug.apk

          echo "APK File Type:"
          file APK_DOWNLOAD/app-debug.apk

          echo "APK Structure Check:"
          unzip -t APK_DOWNLOAD/app-debug.apk | head -n 25

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafa-weather-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 30

      - name: Upload Debug AAB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wafa-weather-debug-aab
          path: .build-outputs/*.aab
          retention-days: 30
